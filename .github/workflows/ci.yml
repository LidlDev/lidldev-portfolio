name: Portfolio checks
on:
  push:
    branches: [main, redesign/portfolio]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser checks
        run: |
          npm run preview > /tmp/portfolio-preview.log 2>&1 &
          PORTFOLIO_BROWSER=chromium npm run test:browser
