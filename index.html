<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LidlDev — Personal projects, built with intent</title>
    <meta
      data-rh="true"
      name="description"
      content="The personal project portfolio of Harry. Mobile experiences, local-first tools and ideas brought to life."
    />
    <meta name="theme-color" content="#F6F3EE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem("lidldev-theme");
        var d =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <meta
      data-rh="true"
      property="og:title"
      content="LidlDev — Personal projects, built with intent"
    />
    <meta
      data-rh="true"
      property="og:description"
      content="Mobile experiences, local-first tools and ideas brought to life."
    />
    <meta
      data-rh="true"
      property="og:url"
      content="https://portfolio.lidldev.com"
    />
    <meta data-rh="true" property="og:type" content="website" />
    <meta
      data-rh="true"
      property="og:image"
      content="https://portfolio.lidldev.com/social-card.png"
    />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This portfolio needs JavaScript for its interactive project pages. You
      can find the projects at
      <a href="https://github.com/LidlDev">LidlDev on GitHub</a> or email
      <a href="mailto:harry@lidldev.com">Harry</a>.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
